name: check

# The guard, on every push and pull request: build the app and run the checks it carries
# (`--selftest`, T96) — an invariant over synthetic inputs, and a document held against the thing it
# documents (T246).
#
# Deliberately a workflow of its own rather than a job added to build.yml. The trigger belongs to the
# workflow, not to the job, and build.yml must stay `workflow_dispatch` — cutting a release is a
# decision somebody makes, never something a push does. A guard that can only run by publishing is
# not a guard: it turns "this commit is red" into "the release is blocked", with an installer
# half-built behind it. build.yml runs the same check again against the packaged single-file .exe,
# which is a different artifact and worth asserting twice.
#
# Nothing here needs a secret, a signature or Inno Setup — build, run, done.
#
# **There is no `paths-ignore`, deliberately (T252).** It held `**.md` on the argument that prose
# cannot move arithmetic, and that expired the day the suite began reading markdown — so T249 removed
# it and kept `docs/**` on the same argument one directory over, with a note saying the line goes the
# day a check reads that directory. T250 was that check and shipped next. Twice in two tasks, a
# hand-kept list of what nothing reads was wrong, and being wrong here does not fail a run: it stops
# one from happening, which is the quietest way this repository has found to lose a check. What the
# list was buying is one build on a commit that touches `LICENSE` alone. A guard nobody can get wrong
# is worth more than the minutes; what those minutes should cost instead is T253.
on:
  push:
    branches: ['**']          # branches only: a tag push is a release, and build.yml owns that path
  pull_request:

permissions:
  contents: read

# A superseded push has nothing left to say — cancel its run rather than queue behind it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # `dotnet build`, not `dotnet publish`: the csproj is self-contained for win-x64 either way, so
      # the plain build output is a runnable .exe, and skipping the single-file bundling and its
      # compression is most of the difference between this job and the release one.
      - name: Build
        run: dotnet build -c Release --nologo

      # Started rather than invoked: the app is a Windows-subsystem .exe, so its output has to be
      # redirected to be seen and its exit code has to be waited for. Same idiom as build.yml.
      #
      # Exit 1 now has two meanings and the log distinguishes them (T218): a property broke, or the run
      # skipped a check nobody agreed to lose. `--selftest` carries a named list of the skips it is
      # allowed to have, so a known one stays green and an unexpected one is red — and the log is printed
      # either way, because a count cannot say which check went missing.
      - name: Self-check
        shell: pwsh
        run: |
          $exe = 'bin\Release\net10.0-windows\win-x64\ClaudeTray.exe'
          $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru `
                 -RedirectStandardOutput selftest.log -RedirectStandardError selftest.err
          Get-Content selftest.log, selftest.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-check failed (exit $($p.ExitCode))" }

  # The interaction loop, on the one case that can run unattended (T194). `--selftest` asserts what can be
  # decided by reading — arithmetic on synthetic inputs, and a document against what it documents; this is
  # the loop that exists because the WPF windows accepted no keyboard input at all from the day the first
  # one shipped (T135) while every screenshot ever taken of them looked perfect. Until now it ran only when
  # somebody chose to run it.
  #
  # Why only `-Case Keyboard`. `Panes`, `Profiles` and `Names` need a rendered report, which needs
  # credentials and a machine's own transcripts; `Menu` needs the notification area. `Keyboard` needs
  # none of it — it launches `--settings-tray` against an unconfigured install, clicks a sidebar item,
  # types into a TextBox, Tabs, and drives a Slider with an arrow key. Adding a case here means first
  # answering what it needs that a runner does not have.
  #
  # A separate job, not a step on `selftest`: this one depends on the runner having a desktop that
  # synthesised input reaches, so a red here means something different from a red there, and the job
  # name should say which at a glance.
  #
  # **Measured before it was committed to, because the answer was not obvious.** §XX.3 asked whether
  # synthesised input arrives on a hosted runner's desktop at all — mouse via `mouse_event`, keys via
  # `keybd_event`, against a WPF window under a WinForms pump. It does: on `windows-latest` all four
  # assertions ran and passed (sidebar click, typing read back through `ValuePattern`, Tab, and an arrow
  # key on a Slider), in ~11s of a 1m30s job that is otherwise the build. No display config, no
  # `-UseRunning`, no credentials. If that ever stops being true the failure will look like an input
  # that never arrives, and `Report-NoReading`'s control-view dump is what says so.
  interaction:
    runs-on: windows-latest
    # The bound §XX.3 asked for. Every wait inside the script is already bounded, so this is the backstop
    # for a hang outside them — a window that never appears, an input that never arrives — and it fails
    # the job instead of burning the six-hour default.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release --nologo

      # Exit 2 is DEGRADED (T193): everything that ran passed, but an assertion could not be evaluated.
      # Treated as a failure here on purpose — the whole point of running this in CI is that nobody is
      # watching, so "proved less than it looks like" must not be a green tick.
      - name: Interaction check (Keyboard)
        shell: pwsh
        run: |
          $exe = 'bin\Release\net10.0-windows\win-x64\ClaudeTray.exe'
          & powershell -ExecutionPolicy Bypass -File scripts\Check-Interaction.ps1 `
              -Case Keyboard -Exe $exe
          $code = $LASTEXITCODE
          if ($code -eq 2) { throw "interaction check DEGRADED (exit 2) - an assertion did not run" }
          if ($code -ne 0) { throw "interaction check failed (exit $code)" }
