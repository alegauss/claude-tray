name: build

# Manual only: run it from the Actions tab (Run workflow). Pick a tag ref
# (e.g. v1.3.15) to also create the release and submit to winget; pick a branch
# to just build and upload the installer artifact.
on:
  workflow_dispatch:

permissions:
  contents: write   # needed to create/attach GitHub Releases when run on a tag ref

jobs:
  build:
    runs-on: windows-latest

    # Mapped here so step-level `if:` can test it — the `secrets` context is not
    # allowed in `if:` conditions, but `env` is.
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The SDK patch is named in `global.json` and nowhere else (T349), so this step installs the
      # very version a local `dotnet publish` resolves to. It is the release path: two patches of one
      # source produced .exes 89 KB apart, and `update-winget.ps1` pins the installer's SHA256 from
      # whatever was built — so a floating SDK makes the published manifest stale against a rebuild.
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish (self-contained, win-x64, single file)
        run: dotnet publish -c Release

      # The pacing and live-rate arithmetic, asserted over synthetic inputs (T96). Runs against the
      # very .exe about to be packaged, and fails the build before an installer is made — the whole
      # point of shipping the checks inside the binary instead of in a test project.
      # Started rather than invoked: the app is a Windows-subsystem .exe, so its output has to be
      # redirected to be seen and its exit code has to be waited for.
      - name: Self-check
        shell: pwsh
        run: |
          $exe = 'bin\Release\net10.0-windows\win-x64\publish\ClaudeTray.exe'
          $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru `
                 -RedirectStandardOutput selftest.log -RedirectStandardError selftest.err
          Get-Content selftest.log, selftest.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-check failed (exit $($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeTray-Setup
          path: dist/ClaudeTray-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ClaudeTray-Setup.exe --clobber
          } else {
            gh release create $tag dist/ClaudeTray-Setup.exe --title $tag --generate-notes
          }

      # --- winget: regenerate manifests and open the PR to microsoft/winget-pkgs ---
      # Runs only on tag pushes, and only if a WINGET_TOKEN secret is configured.
      # The SHA256 comes from the very .exe just built and attached to the release,
      # so the manifest hash always matches the published asset.
      - name: Regenerate winget manifests
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v',''
          ./build/update-winget.ps1 -Version $version

      - name: Submit to winget-pkgs
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit build/winget --token $env:WINGET_TOKEN
