name: build

# Manual only: run it from the Actions tab (Run workflow). Pick a tag ref
# (e.g. v1.3.15) to also create the release and submit to winget; pick a branch
# to just build and upload the installer artifact.
on:
  workflow_dispatch:

permissions:
  contents: write   # needed to create/attach GitHub Releases when run on a tag ref

jobs:
  build:
    runs-on: windows-latest

    # Mapped here so step-level `if:` can test it — the `secrets` context is not
    # allowed in `if:` conditions, but `env` is.
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x64, single file)
        run: dotnet publish -c Release

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeTray-Setup
          path: dist/ClaudeTray-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ClaudeTray-Setup.exe --clobber
          } else {
            gh release create $tag dist/ClaudeTray-Setup.exe --title $tag --generate-notes
          }

      # --- winget: regenerate manifests and open the PR to microsoft/winget-pkgs ---
      # Runs only on tag pushes, and only if a WINGET_TOKEN secret is configured.
      # The SHA256 comes from the very .exe just built and attached to the release,
      # so the manifest hash always matches the published asset.
      - name: Regenerate winget manifests
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v',''
          ./build/update-winget.ps1 -Version $version

      - name: Submit to winget-pkgs
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit build/winget --token $env:WINGET_TOKEN
