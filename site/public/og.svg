<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Claude Code Tray — your Claude Code usage, always in the tray">
  <defs>
    <linearGradient id="ct-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E89070"/>
      <stop offset="1" stop-color="#B85C3C"/>
    </linearGradient>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171008"/>
      <stop offset="1" stop-color="#1f160e"/>
    </linearGradient>
    <radialGradient id="ct-glow" cx="0.82" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ct-bg)"/>
  <rect width="1200" height="630" fill="url(#ct-glow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#D97757"/>

  <!-- The mark: the tray tile itself, at 128px — a fill bar risen to 62% with the
       percentage over it, which is what the icon actually draws. -->
  <g transform="translate(90,120) scale(0.8)">
    <rect width="160" height="160" rx="34" fill="url(#ct-body)"/>
    <rect x="18" y="79" width="124" height="63" rx="10" fill="#4A90E2" opacity=".55"/>
    <text x="80" y="112" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">62</text>
  </g>

  <text x="238" y="180" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#f4ece4">Claude Code Tray</text>
  <text x="240" y="216" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8a7868">part of alegauss</text>

  <text x="90" y="360" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="bold" fill="#f4ece4">Your Claude Code usage,</text>
  <text x="90" y="436" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="bold" fill="#E89070">always in the tray.</text>

  <!-- measured at 978px against the 1020px between the gutters; the previous
       line ran 125px past x=1110 and was clipped mid-word by the canvas edge -->
  <text x="92" y="502" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#b6a596">Burn-rate projection · per-session cost · a context audit · nothing uploaded.</text>

  <!-- status badge -->
  <rect x="90" y="540" width="440" height="46" rx="23" fill="#241a12" stroke="#3a2c20"/>
  <circle cx="118" cy="563" r="6" fill="#E89070"/>
  <text x="136" y="571" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#b6a596">Windows 10 / 11 · No API key · Apache 2.0</text>

  <text x="1110" y="571" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8a7868">alegauss.github.io/claude-tray</text>
</svg>
