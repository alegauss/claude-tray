<!doctype html>
<html lang="en" data-tone="warm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/claude-tray/logo.png" />

    <!--
      The theme follows the OS, and a stored choice wins over it. The design system's
      pre-paint script replaces the anchor below, inlined by vite.config.ts: the tokens are
      keyed off data-theme alone, so it states the OS preference too, before first paint.
    -->
    <!--theme-script-->

    <title>Claude Code Tray — Claude usage in your Windows tray</title>
    <meta
      name="description"
      content="Your Claude Code limit in the Windows tray: red before you run out, and a weekly forecast paced to the hours you actually work. Per-session cost at API list prices and a context audit too — computed on your own machine, with no API key to paste."
    />

    <!-- Google Analytics is not in this head: it loads only after the visitor allows it, from
         the banner in components/Consent.tsx. The one host the page reaches unasked is the
         author's own ad network. The loader is fetched
         by the slot component rather than from here, so nothing is requested until a slot
         exists and the theme it should draw in is known. The hint is all this head needs. -->
    <link rel="preconnect" href="https://ads.japode.com" />

    <!--
      scripts/prerender.mjs patches the title, description, canonical and og:url per route
      by replace-or-throw, and inlines the rendered body into the root element. Note: no
      closing head or script token may appear in a comment here, or the Vite asset
      injection and the prerender both anchor to it instead of the real one.
    -->

    <!-- Reveal-on-scroll starts at opacity 0 and is lifted by the client observer. With no
         JS the prerendered text is still in the DOM; this makes it visible too. -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="vg-site">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
